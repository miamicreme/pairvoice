name: Recover original preview branch commit
on:
  push:
    branches: [ops/recover-original-history-20261126]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve exact preview commit without changing existing preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --bare --single-branch --branch preview https://github.com/Kohronburton/PairVoice.git "$RUNNER_TEMP/preview.git"
          git -C "$RUNNER_TEMP/preview.git" push "https://x-access-token:$GH_TOKEN@github.com/miamicreme/pairvoice.git" d478d60e730e036f6b864fbfa1f7266f5294f310:refs/heads/archive/source-history/preview
