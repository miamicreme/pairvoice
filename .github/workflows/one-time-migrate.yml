name: One-time PairVoice repository migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy complete source Git history and branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare https://github.com/Kohronburton/PairVoice.git source.git
          cd source.git
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/miamicreme/pairvoice.git"
          git push destination 'refs/heads/*:refs/heads/*' --force
          git push destination 'refs/tags/*:refs/tags/*'
